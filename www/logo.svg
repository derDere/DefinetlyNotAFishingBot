<?xml version="1.0" encoding="UTF-8"?>
<!-- DefinetlyNotAFishingBot logo: a golden fish in an ornate ring, in the
     spirit of the WoW crest, on a WotLK-ice-blue disc. Source of truth for
     the application icon (app.ico is rendered from this file). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="disc" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1d4f82"/>
      <stop offset="55%" stop-color="#0e2a4d"/>
      <stop offset="100%" stop-color="#060f1f"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2d88f"/>
      <stop offset="45%" stop-color="#c9a24b"/>
      <stop offset="100%" stop-color="#8a6a24"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9e6ab"/>
      <stop offset="55%" stop-color="#d9b25e"/>
      <stop offset="100%" stop-color="#a87f2f"/>
    </linearGradient>
  </defs>

  <!-- inner disc -->
  <circle cx="256" cy="256" r="222" fill="url(#disc)"/>
  <!-- faint frost line inside the disc -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="#7fd4ff" stroke-opacity="0.25" stroke-width="4"/>

  <!-- four compass studs, poking out from under the ring -->
  <g fill="#c9a24b" stroke="#5e4413" stroke-width="6">
    <path d="M256 4 L272 34 L256 64 L240 34 Z"/>
    <path d="M508 256 L478 272 L448 256 L478 240 Z"/>
    <path d="M256 508 L240 478 L256 448 L272 478 Z"/>
    <path d="M4 256 L34 240 L64 256 L34 272 Z"/>
  </g>

  <!-- the golden ring -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#ring)" stroke-width="44"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#5e4413" stroke-width="6"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#5e4413" stroke-width="6"/>

  <!-- the fish -->
  <g transform="rotate(-8 256 256)">
    <path d="M110 256 C138 196 216 168 302 214 L396 170 C382 226 382 286 396 342 L302 298 C216 344 138 316 110 256 Z"
          fill="url(#fish)" stroke="#4a3410" stroke-width="9" stroke-linejoin="round"/>
    <path d="M188 214 C206 240 206 272 188 298" fill="none" stroke="#4a3410" stroke-width="7" stroke-opacity="0.55" stroke-linecap="round"/>
    <circle cx="158" cy="245" r="13" fill="#0b1a2e"/>
  </g>
</svg>
